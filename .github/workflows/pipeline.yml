name: Pipeline Deteksi Anomali Pangan DIY

on:
  schedule:
    # Tiga run tetap per hari, dipilih agar hasilnya siap pada jam kerja kantor
    # (WIB = UTC+7). Semua sumber otomatis diambil di SETIAP run, supaya kolom
    # "dicek" di papan pantau kompak untuk semua pilar.
    #   06.05 WIB -> siap sebelum jam masuk kantor
    - cron: "5 23 * * *"
    #   10.05 WIB -> menangkap harga PIHPS hari berjalan (terbit ~08.00-09.00 WIB)
    - cron: "5 3 * * *"
    #   13.05 WIB -> selesai sebelum jam istirahat berakhir, siap untuk rapat sore
    - cron: "5 6 * * *"
    # Catatan: GitHub menjalankan jadwal "sebisanya"; mulai bisa mundur 5-30 menit.
  workflow_dispatch:      # bisa dipicu manual dari tab Actions -- isi 2 kotak di
                          # bawah kalau mau ISI HISTORI sekali (biarkan default
                          # kalau cuma mau jalan seperti biasa)
    inputs:
      hari_backfill_pihps:
        description: >-
          Isi histori PIHPS berapa hari ke belakang? (0 = mode biasa/14 hari
          terakhir saja; isi mis. 180 utk ~6 bulan, 365 utk ~1 tahun)
        required: false
        default: "0"
      halaman_dpkp:
        description: >-
          Isi histori DPKP DIY berapa halaman? (1 halaman = 1 hari; default 10
          = mode biasa; isi mis. 180 utk ~6 bulan, 365 utk ~1 tahun, maks ~502)
        required: false
        default: "10"
      hari_sp2kp:
        description: >-
          Isi histori SP2KP berapa hari ke belakang? (default 30 = mode biasa;
          isi mis. 400 utk ~1 tahun, 980 utk sejak Jan 2024)
        required: false
        default: "30"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ambil data BMKG
        run: python src/sources/bmkg_cuaca.py
        continue-on-error: true

      - name: Ambil riwayat curah hujan bulanan DIY (Open-Meteo ERA5, 1991-kini)
        run: python src/sources/curah_hujan_openmeteo.py
        continue-on-error: true

      - name: Ambil data PIHPS
        run: python src/sources/pihps_scraper.py --hari-mundur "${{ github.event.inputs.hari_backfill_pihps || 0 }}"
        continue-on-error: true

      - name: Ambil data DPKP DIY (harga pangan)
        run: python src/sources/dpkp_diy_scraper.py --pages "1-${{ github.event.inputs.halaman_dpkp || 10 }}"
        continue-on-error: true

      - name: Ambil data SP2KP Kemendag (dasar penghitungan IPH)
        run: python src/sources/sp2kp_kemendag.py --hari-mundur "${{ github.event.inputs.hari_sp2kp || 30 }}"
        continue-on-error: true

      - name: Ambil data SIMOTANDI (fase tanam padi)
        run: python src/sources/simotandi.py
        continue-on-error: true

      - name: Ambil data cadangan pangan DIY
        run: python src/sources/cadangan_pangan_scraper.py
        continue-on-error: true

      - name: Ambil sinyal Google Trends (proksi kepanikan publik)
        run: python src/sources/google_trends_panik.py
        continue-on-error: true

      - name: Ambil indeks ENSO/El Nino (NOAA ONI)
        run: python src/sources/enso_noaa.py
        continue-on-error: true

      - name: Analisis hujan - El Nino - panen padi
        run: python src/pipeline/analisis_iklim_panen.py
        continue-on-error: true

      - name: Ringkas SP2KP untuk papan pantau
        run: python src/pipeline/ringkas_sp2kp.py
        continue-on-error: true

      - name: Gabungkan & deteksi anomali
        run: python src/pipeline/merge_and_detect.py
        continue-on-error: true

      - name: Prakiraan harga & risiko lonjakan (1 minggu & 1 bulan)
        run: python src/pipeline/forecast_harga.py
        continue-on-error: true

      - name: Validasi anomali via berita (Google News RSS -> Bing RSS -> Firecrawl)
        run: python src/pipeline/news_validation.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        continue-on-error: true

      - name: Catat status pipeline
        # Menulis data/status_pipeline.csv: kapan tiap sumber dicek pada run ini
        # dan apakah berkasnya berubah. Dibaca papan pantau untuk kolom "dicek".
        run: python src/pipeline/catat_status.py
        continue-on-error: true

      - name: Commit hasil
        run: |
          git config user.name "yes2026-bot"
          git config user.email "actions@users.noreply.github.com"
          # Salin data juga ke docs/data/ supaya dashboard GitHub Pages bisa
          # memuatnya dari domain yang sama (cepat & TIDAK kena rate-limit
          # raw.githubusercontent.com -- penyebab bagian dashboard kadang
          # tampak "kosong" sesaat padahal datanya ada).
          mkdir -p docs/data
          # Salin semua CSV KECUALI SP2KP mentah (belasan MB, terlalu berat untuk
          # peramban). Versi ringkasnya sudah dibuat langkah "Ringkas SP2KP".
          for f in data/*.csv; do
            case "$(basename "$f")" in
              harga_sp2kp_diy.csv) ;;
              *) cp -f "$f" docs/data/ ;;
            esac
          done
          cp -f data/*.geojson docs/data/ 2>/dev/null || true   # batas wilayah utk peta koroplet
          cp -f data/*.json docs/data/ 2>/dev/null || true      # hasil analisis (hujan-ENSO-panen)
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "chore: update data pipeline $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # PENTING (pelajaran run 30 Agt yang gagal setelah 1 jam): kalau ada
          # commit lain masuk ke main SELAMA pipeline jalan (mis. kita commit
          # perbaikan kode lewat web editor), `git push` polos DITOLAK
          # (non-fast-forward) -> seluruh hasil run hangus. Maka: tarik dulu
          # commit terbaru & susun ulang commit data kita di atasnya, baru push.
          # File data pipeline tidak pernah diedit manual, jadi rebase-nya
          # selalu mulus tanpa konflik.
          git pull --rebase origin main
          git push
